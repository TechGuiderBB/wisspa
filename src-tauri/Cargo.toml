[package]
name = "wisspa"
version = "0.4.0"
description = "Wisspa — system-wide AI voice tool for macOS"
authors = ["TechGuider"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
log = { version = "0.4", features = ["std"] }
sha2 = "0.10"
# `stored` only (no deflate) so we don't pull new compression backends into the
# cargo-audit surface; diagnostics logs are small and redacted (issue #33).
zip = { version = "4", default-features = false }
keyring = { version = "3", features = ["apple-native"] }
serde_yaml = "0.9"
strsim = "0.11"
notify = "6"
notify-debouncer-mini = "0.4"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
core-foundation = "0.10"
similar = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2.5.1"
# Already in the tree transitively (via tauri); promoted to a direct dep for the
# per-install license instance id. Feature unification adds nothing new to build.
uuid = { version = "1", features = ["v4"] }

# Direct NSPasteboard access for lossless clipboard snapshot/restore (issue #32).
# objc2 / objc2-app-kit / objc2-foundation are already in the tree transitively
# via Tauri; promoting them to direct deps pulls in exactly one additional
# crate, objc2-core-video (a non-optional dependency of objc2-app-kit that no
# feature flag removes). That is the full cargo-audit-surface delta.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSString"] }

[dev-dependencies]
# `test` feature enables tauri::test::mock_app() / MockRuntime, used by the
# executor unit tests to drive execute()/run_confirmed() without a real
# window or macOS permissions. This is a dev-dependency: it is compiled only
# for test builds and has no effect on the release binary.
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
